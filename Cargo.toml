[workspace]
resolver = "2"
members = ["crates/peadrive-core", "src-tauri"]

[workspace.package]
# 0.0.1 = giai đoạn đang phát triển (chưa phát hành). Khi phát hành: đổi cả `src-tauri/tauri.conf.json` (có test canh lệch).
version = "0.0.1"
edition = "2021"
license = "MIT"
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package."*"]
opt-level = 2
