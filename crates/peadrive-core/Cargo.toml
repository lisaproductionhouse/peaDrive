[package]
name = "peadrive-core"
description = "Lõi tải Google Drive: OAuth PKCE, chunked streaming, worker pool, ring buffer"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Bản build "personal": xin toàn quyền Drive (scope `drive`) thay vì `drive.readonly` + `drive.file`.
# Đây là điểm khác biệt duy nhất về quyền giữa hai bản build; xem docs/FLAVORS.md.
full-drive = []

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
futures-util = "0.3"
bytes = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
rand = "0.8"
tracing = "0.1"
webbrowser = "1"
keyring = { version = "3", default-features = false }
fs4 = "1.1"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
tempfile = "3"
