name: build
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Hai flavor từ một mã nguồn (xem docs/FLAVORS.md):
#   public   = mặc định           → scope drive.readonly + drive.file
#   personal = --features full-drive → scope drive (toàn quyền), identifier / keychain / OAuth client riêng

jobs:
  core-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  flavor: public,   args: "" }
          - { os: ubuntu-latest,  flavor: personal, args: "--features full-drive" }
          # Mã liệt kê ổ đĩa dùng API Windows (GetLogicalDrives / GetDiskFreeSpaceExW): Ubuntu không chạy được nên cần runner Windows.
          - { os: windows-latest, flavor: public,   args: "--lib local::" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (${{ matrix.os }}, ${{ matrix.flavor }})
        run: cargo test -p peadrive-core ${{ matrix.args }}
      - uses: actions/setup-node@v4
        if: matrix.os == 'ubuntu-latest' && matrix.flavor == 'public'
        with: { node-version: 22 }
      - name: Thử giao diện (jsdom; không phụ thuộc flavor)
        if: matrix.os == 'ubuntu-latest' && matrix.flavor == 'public'
        run: npm ci && npm test
        working-directory: tools/ui-smoke

  bundle:
    needs: core-tests
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        flavor: [public, personal]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # OAuth client được khoá cứng vào bản build từ file `.env.<flavor>` ở gốc dự án (crates/peadrive-core/build.rs đọc).
      # File thật không nằm trong git, nên job ghi nó từ secret; thiếu secret thì dừng, KHÔNG rơi về client của flavor kia
      # (client public khai scope khác; dùng nhầm sẽ xin sai scope so với consent screen).
      - name: Ghi .env.${{ matrix.flavor }} (OAuth client của flavor ${{ matrix.flavor }})
        shell: bash
        env:
          PUBLIC_ID: ${{ secrets.PEADRIVE_CLIENT_ID }}
          PUBLIC_SECRET: ${{ secrets.PEADRIVE_CLIENT_SECRET }}
          PERSONAL_ID: ${{ secrets.PEADRIVE_PERSONAL_CLIENT_ID }}
          PERSONAL_SECRET: ${{ secrets.PEADRIVE_PERSONAL_CLIENT_SECRET }}
        run: |
          if [ "${{ matrix.flavor }}" = "personal" ]; then id="$PERSONAL_ID"; secret="$PERSONAL_SECRET"; names="PEADRIVE_PERSONAL_CLIENT_ID / PEADRIVE_PERSONAL_CLIENT_SECRET"
          else id="$PUBLIC_ID"; secret="$PUBLIC_SECRET"; names="PEADRIVE_CLIENT_ID / PEADRIVE_CLIENT_SECRET"; fi
          if [ -z "$id" ] || [ -z "$secret" ]; then
            echo "::error::Thiếu secret của repo: $names (flavor ${{ matrix.flavor }}) — xem docs/FLAVORS.md"
            exit 1
          fi
          echo "::add-mask::$secret"
          umask 077
          printf 'PEADRIVE_CLIENT_ID=%s\nPEADRIVE_CLIENT_SECRET=%s\n' "$id" "$secret" > ".env.${{ matrix.flavor }}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with: { key: "${{ matrix.flavor }}" }
      - run: cargo install tauri-cli --version "^2" --locked
      - name: cargo tauri build (${{ matrix.flavor }})
        run: cargo tauri build ${{ matrix.os == 'macos-latest' && '--target universal-apple-darwin' || '' }} ${{ matrix.flavor == 'personal' && '--features full-drive --config src-tauri/tauri.personal.conf.json' || '' }}
      - uses: actions/upload-artifact@v4
        with:
          name: peadrive-${{ matrix.flavor }}-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/*.exe
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
